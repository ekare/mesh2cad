name: Windows x64 release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Build and verify package
        shell: pwsh
        run: .\scripts\build-release.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: mesh2cad-windows-x64
          path: |
            release/mesh2cad-*-windows-x64.zip
            release/mesh2cad-*-windows-x64.zip.sha256
          if-no-files-found: error
