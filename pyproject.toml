[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mesh2cad"
version = "0.1.0"
description = "Analytic STL-to-STEP reconstruction for simple mechanical parts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Prepared together with ChatGPT." }]
keywords = ["cad", "stl", "step", "brep", "opencascade", "reverse-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "trimesh>=4.4,<5",
  "networkx>=3.0,<4",
  "fast-simplification>=0.0.4,<1",
  "rtree>=1.4,<2",
  "cadquery-ocp>=7.7.2,<8",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
dataset = [
  "huggingface-hub>=2.2.0,<3",
  "py7zr>=1.1.3,<2",
  "pyarrow>=18,<24",
  "tqdm>=4.66,<5",
]
ml = [
  "torch>=2.3,<3",
  "tqdm>=4.66,<5",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
]
release = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
mesh2cad = "mesh2cad.cli:main"
mesh2cad-demo = "mesh2cad.cli:demo_main"
mesh2cad-abc = "mesh2cad.dataset.abc:main"
mesh2cad-automate = "mesh2cad.dataset.automate:main"
mesh2cad-automate-provenance = "mesh2cad.dataset.provenance:main"
mesh2cad-parquet-step = "mesh2cad.dataset.parquet_step:main"
mesh2cad-dataset = "mesh2cad.learning.prepare:main"
mesh2cad-train = "mesh2cad.learning.train:main"
mesh2cad-predict = "mesh2cad.learning.infer:main"
mesh2cad-export-model = "mesh2cad.learning.model_export:main"
mesh2cad-export-split = "mesh2cad.learning.split_export:main"
mesh2cad-model-card = "mesh2cad.learning.model_card:main"
mesh2cad-qualify-model = "mesh2cad.learning.qualification:main"
mesh2cad-benchmark = "mesh2cad.learning.benchmark:main"
mesh2cad-repair-benchmark = "mesh2cad.learning.repair_benchmark:main"
mesh2cad-repair = "mesh2cad.repair:main"
mesh2cad-web = "mesh2cad.webapp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh2cad"]
artifacts = ["src/mesh2cad/web_static/**"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
